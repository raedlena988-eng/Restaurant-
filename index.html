<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jordan Build 19th — Storyboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1628;--navy2:#0d1e36;--gold2:#e8a020;--gold3:#f0c050;--offwhite:#f5f3ef;--text:#1a1a1a;--muted:#6b6560;--steel:#1e3a5f;--green:#085041;--green-bg:#e1f5ee;--amber:#633806;--amber-bg:#faeeda;--purple:#3c3489;--purple-bg:#eeedfe}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Cairo',sans-serif;background:var(--navy);color:#fff;overflow-x:hidden;-webkit-text-size-adjust:100%}
/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,22,40,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(232,160,32,.2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:56px;gap:8px}
.brand{font-size:15px;font-weight:900;color:var(--gold2);font-family:'Montserrat',sans-serif;letter-spacing:.04em;line-height:1.2}
.brand small{display:block;font-size:9px;color:rgba(255,255,255,.32);font-weight:600;margin-top:1px}
.hdr-r{display:flex;align-items:center;gap:8px}
.cnt{background:rgba(232,160,32,.12);border:1px solid rgba(232,160,32,.3);color:var(--gold2);font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;font-family:'Montserrat',sans-serif;white-space:nowrap}
.lang-w{display:flex;background:rgba(255,255,255,.07);border-radius:20px;padding:2px;gap:2px}
.lb{padding:4px 12px;border-radius:18px;border:none;cursor:pointer;font-size:11px;font-weight:700;font-family:'Cairo',sans-serif;color:rgba(255,255,255,.4);background:transparent;transition:all .2s;-webkit-tap-highlight-color:transparent}
.lb.on{background:var(--gold2);color:var(--navy)}
.sb{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;-webkit-tap-highlight-color:transparent}
/* VIEWER */
.viewer{position:relative;background:#000;overflow:hidden;touch-action:pan-y}
.viewer img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;transition:opacity .4s,transform .4s}
.viewer img.out{opacity:0;transform:scale(1.02)}
.vg{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,22,40,.88) 0%,rgba(10,22,40,.25) 50%,rgba(10,22,40,.12) 100%);pointer-events:none}
.vgt{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,22,40,.4) 0%,transparent 25%);pointer-events:none}
.sbadge{position:absolute;top:12px;right:12px;background:var(--gold2);color:var(--navy);font-size:9px;font-weight:900;font-family:'Montserrat',sans-serif;padding:3px 10px;border-radius:20px;letter-spacing:.08em}
.tbadge{position:absolute;top:12px;left:12px;background:rgba(10,22,40,.8);border:1px solid rgba(232,160,32,.4);color:var(--gold3);font-size:9px;font-weight:600;font-family:'Montserrat',sans-serif;padding:3px 10px;border-radius:20px}
.vtxt{position:absolute;bottom:44px;right:14px;left:14px;text-align:right}
.vtxt.ltr{text-align:left;direction:ltr}
.vl{width:30px;height:3px;background:var(--gold2);border-radius:2px;margin-bottom:7px;margin-right:auto}
.vtxt.ltr .vl{margin-right:0;margin-left:auto}
.vm{font-size:clamp(14px,4vw,26px);font-weight:900;color:#fff;line-height:1.3;text-shadow:0 2px 14px rgba(0,0,0,.8);white-space:pre-line;font-family:'Cairo',sans-serif}
.vm.en{font-family:'Montserrat',sans-serif;font-size:clamp(13px,3.2vw,22px)}
.pw{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1)}
.pf{height:100%;background:var(--gold2);border-radius:0 2px 2px 0;transition:width .35s}
/* NAV */
.nav{background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.06);padding:10px 14px;display:flex;align-items:center;gap:8px}
.arr{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;-webkit-tap-highlight-color:transparent}
.arr:active{background:var(--gold2);border-color:var(--gold2);color:var(--navy)}
.dots{flex:1;display:flex;gap:3px;justify-content:center}
.dot{height:5px;flex:1;max-width:38px;border-radius:3px;background:rgba(255,255,255,.12);cursor:pointer;border:none;transition:all .2s;-webkit-tap-highlight-color:transparent}
.dot.done{background:rgba(232,160,32,.35)}
.dot.on{background:var(--gold2)}
/* THUMBS */
.thumbs{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;background:var(--navy);padding:2px}
.th{position:relative;aspect-ratio:16/9;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on::after{content:'';position:absolute;inset:0;border:2px solid var(--gold2);pointer-events:none}
.th-n{position:absolute;bottom:1px;left:2px;font-size:7px;font-weight:700;color:var(--gold2);font-family:'Montserrat',sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.9)}
/* DETAIL */
.det{background:var(--offwhite);color:var(--text);padding:20px 14px 32px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:1000px;margin:0 auto}
.df{grid-column:1/-1}
.dtitle{font-size:18px;font-weight:900;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px;font-family:'Cairo',sans-serif}
.dtitle::before{content:'';width:4px;height:18px;background:var(--gold2);border-radius:2px;display:block;flex-shrink:0}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ch{padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);background:#f0eee8;border-bottom:1px solid #e0ddd6;font-family:'Montserrat',sans-serif}
.cb{padding:12px;font-size:13px;line-height:1.7;color:var(--text)}
.cb.rtl{direction:rtl;text-align:right;font-family:'Cairo',sans-serif;font-size:14px}
.ovc{background:var(--navy)}
.ovc .ch{background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.1);color:var(--gold2)}
.ovc .cb{color:#fff;font-size:clamp(13px,3vw,17px);font-weight:700;white-space:pre-line;font-family:'Cairo',sans-serif}
.ovc .cb.en{font-family:'Montserrat',sans-serif}
.sr{display:grid;grid-template-columns:1fr 1fr 1fr}
.sc{padding:10px 12px}
.sc:not(:last-child){border-right:1px solid #e8e4dd}
.sl{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-family:'Montserrat',sans-serif}
.sv{font-size:12px;line-height:1.5;font-family:'Cairo',sans-serif}
.sv.g{color:var(--green)}.sv.a{color:var(--amber);font-family:'Montserrat',sans-serif;font-size:11px}.sv.p{color:var(--purple)}
.kb{text-align:center;padding:8px;font-size:10px;color:rgba(255,255,255,.16);font-family:'Montserrat',sans-serif;background:var(--navy)}
@media(max-width:600px){
  .thumbs{grid-template-columns:repeat(6,1fr)}
  .dg{grid-template-columns:1fr}.df{grid-column:1}
  .sr{grid-template-columns:1fr}.sc:not(:last-child){border-right:none;border-bottom:1px solid #e8e4dd}
}
</style>
</head>

<header class="hdr">
  <div class="brand">JORDAN BUILD 19TH<small>Production Storyboard</small></div>
  <div class="hdr-r">
    <span class="cnt" id="cnt">01 / 11</span>
    <button class="sb" id="sb" onclick="toggleSnd()">🔊</button>

</div>
